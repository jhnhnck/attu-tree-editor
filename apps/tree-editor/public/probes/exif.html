<!doctype html>
<!--
    FamilyTreeEditor - phase 0a exif-orientation probe (real-device hardware test)

    open this page on an iphone or other real device, pick an iphone-shot photo
    with portrait/landscape orientation (exif orientation 3, 6, or 8), and copy
    the printed dimensions into `.claude/plans/portrait-cropper-rewrite/pre-mortem.md`
    under the "## probe results" section.

    if displayed width/height match the visually-rotated dimensions, the
    pre-mortem's risk #2 is retired and phase 2b's exif path is safe.
    if not, the <img>-fallback path in loadSourceBitmap.ts must be exercised.

    licensed under the MIT license; see LICENSE.md for full text
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>probe: exif orientation</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                max-width: 40rem;
                margin: 1rem auto;
                padding: 0 1rem;
            }
            pre {
                background: #f0f0f0;
                padding: 0.5rem;
                overflow-x: auto;
                font-size: 0.85rem;
            }
            .row {
                margin: 0.5rem 0;
            }
            .ok {
                color: #060;
            }
            .warn {
                color: #c60;
            }
        </style>
    </head>
    <body>
        <h1>exif orientation probe</h1>
        <p>
            pick an iphone-shot photo (orientation 3, 6, or 8 ideal — portrait shot held vertically
            is usually 6).
        </p>

        <input id="file" type="file" accept="image/*" />

        <div id="out" class="row"></div>

        <h2>what to record</h2>
        <p>
            copy the row labeled <code>RESULT</code> into the pre-mortem's "probe results" section.
        </p>

        <script>
            const out = document.getElementById("out");
            document.getElementById("file").addEventListener("change", async (e) => {
                const f = e.target.files && e.target.files[0];
                if (!f) return;
                out.innerHTML = "<p>loading...</p>";

                // baseline: file metadata
                const lines = [];
                lines.push(`<div class="row">file: ${f.name} (${f.type}, ${f.size} bytes)</div>`);

                // probe 1: createImageBitmap with imageOrientation: from-image
                try {
                    const bm = await createImageBitmap(f, { imageOrientation: "from-image" });
                    lines.push(
                        `<div class="row">createImageBitmap dims: <b>${bm.width} × ${bm.height}</b></div>`,
                    );
                    bm.close();
                } catch (err) {
                    lines.push(
                        `<div class="row warn">createImageBitmap threw: ${err.message}</div>`,
                    );
                }

                // probe 2: createImageBitmap with imageOrientation: none (raw dims)
                try {
                    const bm = await createImageBitmap(f, { imageOrientation: "none" });
                    lines.push(
                        `<div class="row">createImageBitmap raw (none) dims: ${bm.width} × ${bm.height}</div>`,
                    );
                    bm.close();
                } catch (err) {
                    lines.push(
                        `<div class="row warn">createImageBitmap(none) threw: ${err.message}</div>`,
                    );
                }

                // probe 3: <img> natural dimensions (browser css default applies image-orientation: from-image)
                const url = URL.createObjectURL(f);
                await new Promise((resolve) => {
                    const img = new Image();
                    img.style.imageOrientation = "from-image";
                    img.onload = () => {
                        lines.push(
                            `<div class="row">&lt;img&gt; naturalWidth × naturalHeight: ${img.naturalWidth} × ${img.naturalHeight}</div>`,
                        );
                        URL.revokeObjectURL(url);
                        resolve();
                    };
                    img.onerror = () => {
                        lines.push(`<div class="row warn">&lt;img&gt; failed to decode</div>`);
                        URL.revokeObjectURL(url);
                        resolve();
                    };
                    img.src = url;
                });

                // bottom-line: do the from-image dims match what you see when you view the photo normally?
                lines.push(
                    `<div class="row"><b>RESULT</b> — paste into pre-mortem: createImageBitmap(from-image) returned dims that <em>match / do not match</em> the visually-rotated photo. ua=${navigator.userAgent}</div>`,
                );
                out.innerHTML = lines.join("\n");
            });
        </script>
    </body>
</html>
