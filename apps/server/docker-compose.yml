# standalone compose for the backend in development
# attached to the attu-wiki-dev compose externally via the same network in phase 5

services:
    server:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: attu-tree
        ports:
            - "127.0.0.1:8000:8000"
        environment:
            - PYTHONUNBUFFERED=1
        restart: unless-stopped
