# compose for the family tree editor
# single combined image: fastapi serves the spa at / and the api at /api/
# (caddy on the wiki side strips the public /trees/ prefix before proxying).
#
# include from the parent attu-wiki-dev stacks:
#   include:
#     - path: ./devel/FamilyTreeEditor/docker-compose.yml
#       project_directory: ./devel/FamilyTreeEditor
#
# all per-deployment config (including secrets) lives in `./data/trees-config.toml`,
# which is bind-mounted alongside the sqlite db. no .env is read at runtime.
# see notes/agents.md §4.

name: family-tree

networks:
    attu:
        external: true
        name: ${ATTU_NETWORK:-attu_dev}

services:
    family-tree:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: attu-tree
        environment:
            - PYTHONUNBUFFERED=1
        healthcheck:
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s
            test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
        logging:
            driver: journald
        networks:
            - attu
        restart: unless-stopped
        volumes:
            - ./data:/app/data
