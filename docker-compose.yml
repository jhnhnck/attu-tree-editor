# compose for the family tree editor
# single combined image: fastapi serves the spa at / and the api at /api/
#
# include from the parent attu-wiki-dev stacks:
#   include:
#     - path: ./devel/FamilyTreeEditor/docker-compose.yml
#       project_directory: ./devel/FamilyTreeEditor
#
# port assignments (set FAMILY_TREE_PORT to override):
#   prod: 127.0.0.1:6014:8000   (attuproject.org/trees/)
#   dev:  127.0.0.1:6024:8000   (dev.attuproject.org/trees/)

name: family-tree

networks:
    attu:
        external: true
        name: ${ATTU_NETWORK:-attu_dev}

volumes:
    family-tree-data: {}

services:
    family-tree:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                - VITE_BASE=${VITE_BASE:-/trees/}
        container_name: attu-tree
        env_file:
            - .env
        environment:
            - SESSION_COOKIE_PATH=/trees/
            - PYTHONUNBUFFERED=1
        healthcheck:
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s
            test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
        logging:
            driver: journald
        networks:
            - attu
        ports:
            - "127.0.0.1:${FAMILY_TREE_PORT:-6024}:8000"
        restart: unless-stopped
        volumes:
            - family-tree-data:/app/data
